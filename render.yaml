services:
  - type: web
    name: recipe-generator-api
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install wheel
      pip install -r requirements.txt
    startCommand: python startup.py && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SPOONACULAR_API_KEY
        sync: false
